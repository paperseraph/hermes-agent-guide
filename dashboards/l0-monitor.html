<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L0 望风者 · 实时监控</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #8b949e; --green: #3fb950;
    --yellow: #d29922; --orange: #db6d28; --red: #f85149;
    --blue: #58a6ff; --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    padding: 24px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 1.5rem; font-weight: 600; }
  .header h1 span { color: var(--green); }
  .header .time { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .threat { display: flex; align-items: center; gap: 8px; }
  .threat-badge {
    padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 0.8rem;
  }
  .threat-badge.green { background: #1a3a1a; color: var(--green); }
  .threat-badge.yellow { background: #3a2e0a; color: var(--yellow); }
  .threat-badge.orange { background: #3a1e0a; color: var(--orange); }
  .threat-badge.red { background: #3a0a0a; color: var(--red); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px;
  }
  .card h2 { font-size: 0.95rem; color: var(--muted); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
  .source-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid rgba(48,54,61,0.5);
  }
  .source-row:last-child { border-bottom: none; }
  .source-name { font-size: 0.9rem; }
  .source-status { font-size: 0.8rem; }
  .source-status.live { color: var(--green); }
  .source-status.silent { color: var(--muted); }
  .source-bar {
    width: 80px; height: 6px; background: rgba(48,54,61,0.4);
    border-radius: 3px; overflow: hidden;
  }
  .source-bar-fill {
    height: 100%; border-radius: 3px; transition: width 0.5s;
  }
  .source-bar-fill.active { background: var(--green); }
  .source-bar-fill.watch { background: var(--yellow); }

  .hits { margin-bottom: 20px; }
  .hit-item {
    background: var(--card); border-left: 3px solid var(--border);
    border-radius: 0 8px 8px 0; padding: 14px 20px; margin-bottom: 10px;
  }
  .hit-item.alert { border-left-color: var(--red); }
  .hit-item.warning { border-left-color: var(--yellow); }
  .hit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .hit-score {
    padding: 2px 8px; border-radius: 10px; font-weight: 700; font-size: 0.8rem;
  }
  .hit-score.high { background: #3a0a0a; color: var(--red); }
  .hit-score.mid { background: #3a2e0a; color: var(--yellow); }
  .hit-title { font-weight: 600; margin-bottom: 4px; }
  .hit-meta { font-size: 0.8rem; color: var(--muted); }
  .hit-tags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    background: rgba(88,166,255,0.15); color: var(--blue);
    padding: 2px 8px; border-radius: 10px; font-size: 0.75rem;
  }

  .footer {
    text-align: center; color: var(--muted); font-size: 0.75rem;
    padding-top: 16px; border-top: 1px solid var(--border);
  }

  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🛰️ L0 <span>望风者</span> · 实时监控</h1>
    <div class="time" id="clock">--</div>
  </div>
  <div class="threat">
    <span style="color:var(--muted)">威胁等级</span>
    <span class="threat-badge yellow" id="threat-level">🟡 YELLOW</span>
  </div>
</div>

<div class="grid">
  <div class="card">
    <h2>📡 情报员通道</h2>
    <div id="intel-sources"></div>
  </div>
  <div class="card">
    <h2>🗣️ 舆情兵通道</h2>
    <div id="sentiment-sources"></div>
  </div>
</div>

<div class="card hits">
  <h2>📋 最新命中 (<span id="hit-count">2</span>)</h2>
  <div id="hits-list"></div>
</div>

<div class="footer">
  Powered by Hermes Agent · 数据来源：新浪7×24 / 澎湃新闻 / 腾讯自选股 / 微博热搜 / 知乎 / 头条 / 36氪 / 虎扑 / B站
</div>

<script>
// ── 数据 ──
const intelSources = [
  { name: "新浪7×24", status: "live", hits: 1 },
  { name: "澎湃新闻", status: "silent", hits: 0 },
  { name: "腾讯自选股", status: "silent", hits: 0 },
];
const sentimentSources = [
  { name: "微博热搜", status: "live", hits: 1 },
  { name: "知乎热榜", status: "silent", hits: 0 },
  { name: "头条热榜", status: "silent", hits: 0 },
  { name: "36氪", status: "silent", hits: 0 },
  { name: "虎扑", status: "silent", hits: 0 },
  { name: "B站", status: "silent", hits: 0 },
];
const hits = [
  {
    level: "alert", score: 11, scoreClass: "high",
    title: "中东战争暴露印度经济短板",
    source: "新浪7×24", time: "07:22",
    tags: ["石油", "黄金", "战争", "T1持仓产业"],
    note: "待L1研判"
  },
  {
    level: "warning", score: 2, scoreClass: "mid",
    title: "稀土热度上升",
    source: "微博热搜", time: "07:15",
    tags: ["稀土", "制裁"],
    note: "待L1研判"
  },
];

// ── 渲染 ──
function renderSources(containerId, sources) {
  const html = sources.map(s => `
    <div class="source-row">
      <span class="source-name">${s.name}</span>
      <div class="source-bar">
        <div class="source-bar-fill ${s.status === 'live' ? 'active' : ''}" style="width:${s.hits > 0 ? (s.hits * 60) : 10}%"></div>
      </div>
      <span class="source-status ${s.status}">${s.status === 'live' ? '🔴 ' + s.hits + '条' : '静默'}</span>
    </div>
  `).join('');
  document.getElementById(containerId).innerHTML = html;
}

function renderHits() {
  const html = hits.map(h => `
    <div class="hit-item ${h.level}">
      <div class="hit-header">
        <span class="hit-score ${h.scoreClass}">${h.score}分</span>
        <span style="color:var(--muted);font-size:0.8rem">${h.source} · ${h.time}</span>
      </div>
      <div class="hit-title">${h.title}</div>
      <div class="hit-meta">${h.note}</div>
      <div class="hit-tags">${h.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>
  `).join('');
  document.getElementById('hits-list').innerHTML = html;
  document.getElementById('hit-count').textContent = hits.length;
}

// ── 时钟 ──
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' }) +
    ' · ' + now.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
updateClock();
setInterval(updateClock, 1000);

// ── 初始化 ──
renderSources('intel-sources', intelSources);
renderSources('sentiment-sources', sentimentSources);
renderHits();
</script>
</body>
</html>
