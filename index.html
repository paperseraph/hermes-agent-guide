<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Agent 速查手册</title>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d;
            --text: #c9d1d9; --text2: #8b949e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            line-height: 1.6;
        }
        .container { text-align: center; padding: 40px 20px; max-width: 1050px; }
        h1 { font-size: 2.8rem; font-weight: 700; margin-bottom: 8px; }
        h1 span { color: #3fb950; }
        p.sub { color: var(--text2); font-size: 1.1rem; margin-bottom: 48px; }
        .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 36px 32px; width: 300px; text-decoration: none; color: var(--text);
            transition: all 0.2s; text-align: left;
        }
        .card:hover { border-color: #3fb950; transform: translateY(-2px); }
        .card h2 { font-size: 1.3rem; margin-bottom: 8px; }
        .card .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        .card .dot.green { background: #3fb950; }
        .card .dot.purple { background: #a78bfa; }
        .card .dot.blue { background: #0ea5e9; }
        .card p { color: var(--text2); font-size: 0.92rem; }
        .card .platform { font-size: 0.78rem; color: var(--text2); margin-top: 8px; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <h1><span>Hermes</span> Agent 速查手册</h1>
        <p class="sub">CLI命令 · 会话命令 · 内置技能 · 可用插件</p>
        <div class="cards">
            <a href="green/" class="card">
                <h2><span class="dot green"></span>极简深绿</h2>
                <p>深色背景 + 绿色强调。护眼，适合长时间查阅。</p>
                <div class="platform">Netlify 部署</div>
            </a>
            <a href="purple/" class="card">
                <h2><span class="dot purple"></span>暗色几何紫</h2>
                <p>渐变标题 + 紫色光晕。卡片网格，视觉层次丰富。</p>
                <div class="platform">GitHub Pages</div>
            </a>
            <a href="https://master.hermes-handbook-33q.pages.dev" class="card" style="cursor:alias;">
                <h2><span class="dot blue"></span>靛蓝深渊</h2>
                <p>深海暗蓝 + 青色强调。科幻感，沉浸式阅读体验。</p>
                <div class="platform">Cloudflare Pages</div>
            </a>
        </div>
    </div>
</body>
</html>
